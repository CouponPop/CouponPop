services:
  mysql:
    image: mysql:8.0
    container_name: couponpop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-couponpop}
      MYSQL_USER: ${MYSQL_USER:-couponpop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-couponpop}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - elk
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: couponpop-redis
    # RDB/AOF 비활성화
    command: |
      redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
  
  setup:
    profiles:
      - setup
    build:
      context: setup/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    init: true
    volumes:
      - ./setup/entrypoint.sh:/entrypoint.sh:ro,Z
      - ./setup/lib.sh:/lib.sh:ro,Z
      - ./setup/roles:/roles:ro,Z
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      LOGSTASH_INTERNAL_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
      METRICBEAT_INTERNAL_PASSWORD: ${METRICBEAT_INTERNAL_PASSWORD:-}
      FILEBEAT_INTERNAL_PASSWORD: ${FILEBEAT_INTERNAL_PASSWORD:-}
      HEARTBEAT_INTERNAL_PASSWORD: ${HEARTBEAT_INTERNAL_PASSWORD:-}
      MONITORING_INTERNAL_PASSWORD: ${MONITORING_INTERNAL_PASSWORD:-}
      BEATS_SYSTEM_PASSWORD: ${BEATS_SYSTEM_PASSWORD:-}
    network_mode: service:elasticsearch
    depends_on:
      - elasticsearch

  # 'kibana-genkeys' 서비스는 Kibana의 암호화 키를 생성하고 출력하는 일회성 명령을 실행합니다.
  #
  # 기본적으로 이 서비스는 비기본 프로파일에 속해 있어 'docker compose up'으로 시작되는 서비스에서 제외됩니다.
  # 실행하려면 Compose 명령에 '--profile=setup' CLI 플래그를 제공하거나
  # 서비스 이름을 지정하여 'docker compose up kibana-genkeys'와 같이 실행하세요.
  kibana-genkeys:
    profiles:
      - setup
    build:
      context: kibana/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    command:
      - bin/kibana-encryption-keys
      - generate
    network_mode: none

  elasticsearch:
    build:
      context: elasticsearch/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
      - elasticsearch:/usr/share/elasticsearch/data:Z
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      node.name: elasticsearch
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # 부트스트랩 비밀번호.
      # Elasticsearch의 초기 시작 시 키스토어를 초기화하는 데 사용됩니다.
      # 이후 실행 시에는 무시됩니다.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      # 프로덕션 모드를 비활성화하고 부트스트랩 체크를 피하기 위해 단일 노드 discovery를 사용합니다.
      # 참고: https://www.elastic.co/docs/deploy-manage/deploy/self-managed/bootstrap-checks
      discovery.type: single-node
    networks:
      - elk
    restart: unless-stopped

  logstash:
    build:
      context: logstash/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro,Z
      - logstash_data:/usr/share/logstash/last_run_metadata
    ports:
      - 5044:5044
      - 50000:50000/tcp
      - 50000:50000/udp
      - 9600:9600
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
      LOGSTASH_INTERNAL_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-couponpop}
      MYSQL_USER: ${MYSQL_USER:-couponpop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-couponpop}
    networks:
      - elk
    depends_on:
      - elasticsearch
      - mysql
    restart: unless-stopped

  kibana:
    build:
      context: kibana/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro,Z
    ports:
      - 5601:5601
    environment:
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
    networks:
      - elk
    depends_on:
      - elasticsearch
    restart: unless-stopped

networks:
  elk:
    driver: bridge

volumes:
  elasticsearch:
  mysql_data:
  logstash_data: