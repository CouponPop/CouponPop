name: CouponPop Blue-Green Deploy

on:
  push:
    branches:
      - chore/cicd-v1
#    branches: [ "main" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # Job 1: Build - 코드 빌드 및 Docker 이미지 생성/푸시
  # =================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # =================================================================
  # Job 2: Deploy - 생성된 이미지를 AWS에 Blue/Green 배포
  # =================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build # 'build' Job이 성공적으로 끝나야만 이 Job이 실행됩니다.
    permissions:
      id-token: write
      contents: read
    env:
      # build Job에서 전달받은 이미지 URI를 환경 변수로 설정
      IMAGE_URI: ${{ needs.build.outputs.image_uri }}
      ECR_REGISTRY: ${{ needs.build.outputs.registry }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Identify Environments
        id: identify-envs
        run: |
          LIVE_TG_ARN=$(aws elbv2 describe-listeners --listener-arns ${{ secrets.ALB_LISTENER_ARN }} --query 'Listeners[0].DefaultActions[0].TargetGroupArn' --output text)
          if [ "$LIVE_TG_ARN" == "${{ secrets.BLUE_TG_ARN }}" ]; then
            IDLE_ENV_NAME="green"
            IDLE_TG_ARN="${{ secrets.GREEN_TG_ARN }}"
            LIVE_ENV_NAME="blue"
          else
            IDLE_ENV_NAME="blue"
            IDLE_TG_ARN="${{ secrets.BLUE_TG_ARN }}"
            LIVE_ENV_NAME="green"
          fi
          echo "Deploying to Idle Environment: $IDLE_ENV_NAME"
          echo "idle_env_name=$IDLE_ENV_NAME" >> $GITHUB_OUTPUT
          echo "idle_tg_arn=$IDLE_TG_ARN" >> $GITHUB_OUTPUT
          echo "live_env_name=$LIVE_ENV_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to Idle Environment
        run: |
          USER_DATA_SCRIPT=$(cat <<EOF
          #!/bin/bash
          # --- Docker 설치 및 환경 설정 ---
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl start docker
          systemctl enable docker
          usermod -aG docker ubuntu
          timedatectl set-timezone Asia/Seoul

          # --- AWS CLI v2 설치 ---
          # AWS CLI v2 설치 (Ubuntu 기본 AMI에 포함되어 있지 않을 수 있음)
          apt-get install -y unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install
          
          # --- Secrets Manager에서 비밀 정보 가져오기 ---
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id couponpop/secrets --query SecretString --output text)
          
          # JSON 파싱을 위해 jq 설치
          apt-get install -y jq
          
          # 각 비밀 정보를 변수로 추출
          export DB_URL=$(echo $SECRET_JSON | jq -r .DB_URL)
          export DB_USERNAME=$(echo $SECRET_JSON | jq -r .DB_USERNAME)
          export DB_PASSWORD=$(echo $SECRET_JSON | jq -r .DB_PASSWORD)
          export JWT_SECRET_KEY=$(echo $SECRET_JSON | jq -r .JWT_SECRET_KEY)
          
          # --- ECR 로그인 및 최신 이미지 실행 ---
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          docker run -d --name couponpop-app -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=$DB_URL \
            -e DB_USERNAME=$DB_USERNAME \
            -e DB_PASSWORD=$DB_PASSWORD \
            -e JWT_SECRET_KEY=$JWT_SECRET_KEY \
            ${{ env.IMAGE_URI }}
          EOF
          )
          USER_DATA_BASE64=$(echo "$USER_DATA_SCRIPT" | base64 | tr -d \\n)

          NEW_LT_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id ${{ secrets.LAUNCH_TEMPLATE_ID }} \
            --source-version '$Default' \
            --version-description "Deploy-${{ github.sha }}" \
            --launch-template-data "{\"UserData\":\"$USER_DATA_BASE64\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' --output text)

          # 새 시작 템플릿 버전을 사용하는 새로운 Auto Scaling Group 생성
          IDLE_ASG_NAME="couponpop-${{ steps.identify-envs.outputs.idle_env_name }}-asg"
          aws autoscaling create-auto-scaling-group \
            --auto-scaling-group-name $IDLE_ASG_NAME \
            --launch-template LaunchTemplateId=${{ secrets.LAUNCH_TEMPLATE_ID }},Version=$NEW_LT_VERSION \
            --target-group-arns ${{ steps.identify-envs.outputs.idle_tg_arn }} \
            --min-size 1 --max-size 2 --desired-capacity 1 \
            --vpc-zone-identifier "${{ secrets.VPC_SUBNET_IDS }}"

          # Idle 환경의 Health Check가 성공할 때까지 대기
          echo "Waiting for Idle environment to be healthy..."
          aws elbv2 wait target-in-service --target-group-arn ${{ steps.identify-envs.outputs.idle_tg_arn }}

      - name: Traffic Swap
        run: |
          echo "Swapping traffic to ${{ steps.identify-envs.outputs.idle_env_name }} environment..."
          aws elbv2 modify-listener \
            --listener-arn ${{ secrets.ALB_LISTENER_ARN }} \
            --default-actions Type=forward,TargetGroupArn=${{ steps.identify-envs.outputs.idle_tg_arn }}

      - name: Terminate Old Environment
        if: always()
        run: |
          OLD_ASG_NAME="couponpop-${{ steps.identify-envs.outputs.live_env_name }}-asg"
          echo "Terminating old environment: $OLD_ASG_NAME"
          # 이전 ASG가 존재하는지 확인 후 삭제
          if aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names $OLD_ASG_NAME | grep -q $OLD_ASG_NAME; then
            aws autoscaling delete-auto-scaling-group --auto-scaling-group-name $OLD_ASG_NAME --force-delete
          else
            echo "Old ASG ($OLD_ASG_NAME) not found, skipping termination."
          fi