spring:
  application:
    name: CouponPop
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
    white-list:
      - /api/v1/auth/signup
      - /api/v1/auth/login
      - /actuator/health

fcm:
  firebase-config-path: "firebase/serviceAccountKey.json"
  api-url: "https://fcm.googleapis.com/v1/projects/couponpop/messages:send"
  scope: "https://www.googleapis.com/auth/cloud-platform"
  ttl: "0s"