input {
	beats {
		port => 5044
	}

	tcp {
		port => 50000
	}

	# MySQL JDBC Input Plugin - 병렬 처리 및 스케줄링 설정
	jdbc {
		# MySQL 연결 정보
		jdbc_connection_string => "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
		jdbc_user => "${MYSQL_USER}"
		jdbc_password => "${MYSQL_PASSWORD}"
		jdbc_driver_library => "/usr/share/logstash/lib/mysql/mysql-connector-java.jar"
		jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
		
		# JDBC 페이지네이션 활성화 - 대용량 데이터 처리
		jdbc_paging_enabled => true
		jdbc_page_size => 10000
		
		# Last Run 파일로 중복 수집 방지 (증분 동기화)
		# tracking_column_type는 "timestamp" 또는 "numeric" 사용 가능
		tracking_column => "updated_at"
		tracking_column_type => "timestamp"
		jdbc_last_run_metadata_path => "/usr/share/logstash/last_run_metadata/stores_last_run"
		
		# use_column_value: true일 경우 last_run_metadata에 저장된 값을 사용
		use_column_value => true
		use_last_run_metadata => true
		
		# clean_run: false일 경우 마지막 실행 시점부터 데이터를 가져옴
		clean_run => false
		
		# 스케줄링 설정: 매 시간마다 실행
		# cron 표현식: "초 분 시 일 월 요일"
		schedule => "0 0 * * * *"
		
		# 사용할 SQL 쿼리 (증분 동기화 적용, soft-delete 포함)
		statement => "SELECT * FROM stores WHERE updated_at > :sql_last_value ORDER BY updated_at ASC"
		
		# JDBC 입력 pipeline 태그
		tags => ["jdbc", "stores"]
		type => "store"
	}
}

## 필터 추가 / logstash 플로그인 config

filter {
	if "jdbc" in [tags] {
		# 날짜 필드 변환
		if [created_at] {
			date {
				match => [ "created_at", "ISO8601" ]
				target => "created_at"
			}
		}
		
		if [updated_at] {
			date {
				match => [ "updated_at", "ISO8601" ]
				target => "updated_at"
			}
		}
		
		# deleted_at 필드가 있는지 확인하고 action 타입 설정
		if [deleted_at] {
			# deleted_at이 있으면 soft-delete된 문서로 표시
			mutate {
				add_field => { "[@metadata][action]" => "delete" }
			}
		} else {
			# deleted_at이 없으면 인덱싱
			mutate {
				add_field => { "[@metadata][action]" => "index" }
			}
		}
		
		# Elasticsearch document ID 설정
		mutate {
			add_field => { "[@metadata][document_id]" => "%{id}" }
		}
	}
}

output {
	# JDBC input인 경우 Elasticsearch로 전송
	if "jdbc" in [tags] {
		elasticsearch {
			hosts => "elasticsearch:9200"
			user => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
			
			# JDBC input의 경우 document ID를 명시적으로 설정
			document_id => "%{[@metadata][document_id]}"
			
			# 인덱스 이름 동적 설정
			index => "stores"
			
			# deleted_at이 있는 경우 문서 삭제, 없는 경우 인덱싱
			action => "%{[@metadata][action]}"
			
			# 문서 삭제 시 전체 문서 전송 불필요
			doc_as_upsert => true
		}
	}
	
	# Beats, TCP input인 경우 기존 설정 사용
	else {
		elasticsearch {
			hosts => "elasticsearch:9200"
			user => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
		}
	}
	
	# 디버깅용 stdout output (JDBC 입력만)
	if "jdbc" in [tags] {
		stdout {
			codec => rubydebug
		}
	}
}
