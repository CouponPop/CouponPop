---
## Default Logstash config
## https://github.com/elastic/logstash/blob/main/docker/data/logstash/config/logstash-full.yml
#
api.http.host: 0.0.0.0

node.name: logstash

# Pipeline 성능 최적화 설정
# Worker 스레드 수 조정 (CPU 코어 수에 맞게 조정)
pipeline.workers: 2

# Batch 크기 설정 (처리량 향상)
pipeline.batch.size: 1000

# Batch 지연 시간 설정 (ms)
pipeline.batch.delay: 50

# Queue 설정 - 메모리 큐 사용
queue.type: memory

# Queue 최대 크기 설정
queue.max_bytes: 1gb